name: Download PentAGI Docker Images

on:
  workflow_dispatch:
    inputs:
      images:
        description: 'Docker images to download (comma-separated)'
        required: true
        default: 'vxcontrol/pentagi:latest,vxcontrol/pgvector:latest,vxcontrol/scraper:latest,quay.io/prometheuscommunity/postgres-exporter:v0.16.0'

jobs:
  download-images:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        include:
          - image: vxcontrol/pentagi:latest
            name: pentagi
          - image: vxcontrol/pgvector:latest
            name: pgvector
          - image: vxcontrol/scraper:latest
            name: scraper
          - image: quay.io/prometheuscommunity/postgres-exporter:v0.16.0
            name: postgres-exporter
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Download image
        run: |
          IMAGE="${{ matrix.image }}"
          echo "Downloading $IMAGE..."

          # Retry up to 5 times
          for i in {1..5}; do
            if docker pull "$IMAGE"; then
              echo "Successfully pulled $IMAGE"
              break
            else
              echo "Attempt $i failed, retrying in 10 seconds..."
              sleep 10
            fi
          done

          # Create safe filename
          FILENAME=$(echo "$IMAGE" | sed 's/[\/:]/_/g')
          echo "Saving $IMAGE as $FILENAME.tar..."
          docker save -o "$FILENAME.tar" "$IMAGE"

      - name: Upload image as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: "*.tar"
          retention-days: 1

  combine-images:
    needs: download-images
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Combine all images
        run: |
          echo "Combining all images..."
          mkdir -p combined
          find artifacts -name "*.tar" -exec cp {} combined/ \;
          tar -czf pentagi-images.tar.gz -C combined .

      - name: Upload combined archive
        uses: actions/upload-artifact@v4
        with:
          name: pentagi-images-combined
          path: pentagi-images.tar.gz
          retention-days: 1

      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.run_number }}
          name: PentAGI Images v${{ github.run_number }}
          body: |
            PentAGI Docker images downloaded on ${{ github.event.repository.updated_at }}

            Images included:
            - vxcontrol/pentagi:latest
            - vxcontrol/pgvector:latest
            - vxcontrol/scraper:latest
            - quay.io/prometheuscommunity/postgres-exporter:v0.16.0

            Download the artifact and extract it, then load the images on your server:
            ```bash
            # Extract
            tar -xzf pentagi-images.tar.gz

            # Load each image
            for tarfile in *.tar; do
              docker load -i "$tarfile"
            done
            ```
          files: pentagi-images.tar.gz
          draft: false
          prerelease: false
